<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulEcho 心靈陪伴對話室</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #4A90E2;
            color: white;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        .user-info-bar {
            background: #eef6ff;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #e0e6ed;
        }

        .user-info-bar label {
            font-size: 13px;
            color: #4a5568;
            font-weight: bold;
        }

        .user-info-bar input {
            flex: 1;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            font-size: 13px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-line;
        }

        .message.user {
            align-self: flex-end;
            background-color: #4A90E2;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background-color: #eef2f5;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            height: 45px;
            padding: 10px 14px;
            border-radius: 22px;
            border: 1px solid #ccc;
            resize: none;
            outline: none;
            font-size: 14px;
        }

        button {
            background-color: #4A90E2;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 22px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .loading {
            font-size: 12px;
            color: #888;
            align-self: flex-start;
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <div class="chat-header">💙 SoulEcho 心靈對話室</div>

        <!-- Email 輸入欄位 -->
        <div class="user-info-bar">
            <label for="userEmail">你的 Email：</label>
            <input type="email" id="userEmail" placeholder="例如：user@example.com (輸入後自動載入歷史紀錄)" onchange="loadHistory()"
                required>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message ai">你好！我是 SoulEcho。今天過得怎麼樣呢？無論想聊什麼，我都在這裡聽你說。</div>
        </div>

        <div class="chat-input-area">
            <textarea id="userInput" placeholder="寫下你的心情..." onkeydown="checkEnter(event)"></textarea>
            <button onclick="sendMessage()">發送</button>
        </div>
    </div>

    <script>
        // 設定你的 ngrok 伺服器網址
        const API_BASE_URL = 'https://skipping-computer-siesta.ngrok-free.dev';

        // 儲存目前記憶的對話歷史
        let chatHistory = [];

        // 自動載入該 Email 的歷史對話紀錄
        async function loadHistory() {
            const emailInput = document.getElementById('userEmail');
            const userEmail = emailInput.value.trim();

            if (!userEmail || !userEmail.includes('@')) return;

            try {
                const res = await fetch(`${API_BASE_URL}/api/history`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true' // 繞過 ngrok 攔截警告頁
                    },
                    body: JSON.stringify({ user_id: userEmail })
                });

                const data = await res.json();

                if (data.history && data.history.length > 0) {
                    chatHistory = data.history;

                    // 清空畫面（保留歡迎詞）
                    const chatMessages = document.getElementById('chatMessages');
                    chatMessages.innerHTML = '<div class="message ai">歡迎回來！我是 SoulEcho，很高興能再次陪伴你。</div>';

                    // 渲染舊有對話歷史
                    chatHistory.forEach(item => {
                        const sender = item.role === 'user' ? 'user' : 'ai';
                        appendMessage(sender, item.text);
                    });
                }
            } catch (err) {
                console.error('載入歷史紀錄失敗:', err);
            }
        }

        async function sendMessage() {
            const emailInput = document.getElementById('userEmail');
            const inputEl = document.getElementById('userInput');

            const userEmail = emailInput.value.trim();
            const message = inputEl.value.trim();

            if (!userEmail || !userEmail.includes('@')) {
                return alert('請先輸入有效的 Email，以便系統提供完善的陪伴服務！');
            }
            if (!message) return;

            emailInput.disabled = true; // 發送訊息後鎖定 Email

            const chatMessages = document.getElementById('chatMessages');
            appendMessage('user', message);
            inputEl.value = '';

            const loadingEl = document.createElement('div');
            loadingEl.className = 'loading';
            loadingEl.innerText = 'SoulEcho 正在專心傾聽...';
            chatMessages.appendChild(loadingEl);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // 發送訊息時併入 chatHistory 傳給後端
                const res = await fetch(`${API_BASE_URL}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true' // 繞過 ngrok 攔截警告頁
                    },
                    body: JSON.stringify({
                        user_id: userEmail,
                        message: message,
                        history: chatHistory
                    })
                });

                const data = await res.json();

                if (chatMessages.contains(loadingEl)) {
                    chatMessages.removeChild(loadingEl);
                }

                if (data && data.ai_response) {
                    appendMessage('ai', data.ai_response);

                    // 記錄本次對話至記憶陣列中
                    chatHistory.push({ role: 'user', text: message });
                    chatHistory.push({ role: 'model', text: data.ai_response });

                } else if (data && data.error) {
                    appendMessage('ai', '（系統提醒：' + data.error + '）');
                } else {
                    appendMessage('ai', '（抱歉，回應格式異常，請再試一次...）');
                }

            } catch (err) {
                if (chatMessages.contains(loadingEl)) {
                    chatMessages.removeChild(loadingEl);
                }
                appendMessage('ai', '（抱歉，系統暫時連線不順，請確認 app.py 與 ngrok 是否正常執行...）');
                console.error('Fetch Error:', err);
            }
        }

        function appendMessage(sender, text) {
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function checkEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
    </script>

</body>

</html>
